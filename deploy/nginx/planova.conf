# Planova API — Nginx reverse proxy
# Kurulum:
#   sudo cp deploy/nginx/planova.conf /etc/nginx/sites-available/planova
#   sudo ln -s /etc/nginx/sites-available/planova /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.planovaapp.com     # SSL'i certbot ekler

server {
    listen 80;
    server_name api.planovaapp.com;

    # Proje dosyası/görsel yüklemeleri için
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        # WebSocket (socket.io) desteği — gerçek zamanlı bildirimler için şart
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Uzun süreli WebSocket bağlantıları kopmasın
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
